<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Project</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
      integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="image">
        <div class="logo">
          <img src="assets/odin-lined.png" alt="Odin logo" />
          <h2>ODIN</h2>
        </div>
        <img src="assets/background.jpg" alt="background image" />
      </div>
      <div class="form-container">
        <div class="text">
          <p>
            This is not a real online service! You know you need something<br />
            like this in your life to help you realize your deepest dreams.<br />
            Sign up <span class="italic">now</span> to get started.
          </p>
          <p>You know you want to.</p>
        </div>
        <div class="form">
          <p>Let's do this!</p>
          <form action="#" method="post">
            <div>
              <label for="fname">first name</label>
              <input type="text" name="fname" id="fname" />
            </div>
            <div>
              <label for="lname">last name</label>
              <input type="text" name="lname" id="lname" />
            </div>
            <div>
              <label for="email">email</label>
              <input type="email" name="email" id="email" />
            </div>
            <div>
              <label for="phone">phone number</label>
              <input type="number" name="phone" id="phone" />
            </div>
            <div>
              <label for="password">password</label>
              <input type="text" name="password" id="password" />
            </div>
            <div>
              <label for="confirm">confirm password</label>
              <input type="text" name="confirm" id="confirm" />
            </div>
          </form>
        </div>
        <div class="footer">
          <button type="submit">Create Account</button>
          <p>Already have an account? <a href="#">Log in</a></p>
        </div>
      </div>
    </div>
  </body>
</html>
